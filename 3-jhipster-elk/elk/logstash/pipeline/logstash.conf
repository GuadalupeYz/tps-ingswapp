# Pipeline de Logstash: recibe los logs de JHipster, los limpia y los guarda en Elasticsearch.

input {
  # JHipster (logstash-logback-encoder) envía un JSON por línea por TCP
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Red de seguridad: si algún log trae campos con secretos, se eliminan
  mutate {
    remove_field => ["password", "token", "authorization"]
  }

  # Enmascarar números de tarjeta: deja visibles solo los últimos 4 dígitos
  mutate {
    gsub => ["message", "\d{12}(\d{4})", "************\1"]
  }

  # Enriquecer: entorno de donde viene el log
  mutate {
    add_field => { "env" => "dev" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "jhipster-logs-%{+YYYY.MM.dd}"
  }
}
